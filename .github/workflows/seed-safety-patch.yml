name: Apply seed safety hardening

on:
  push:
    branches:
      - agent/seed-safety-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7.0.1
        with:
          ref: agent/seed-safety-hardening

      - name: Keep workflow edits for the repository connector
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-seed-safety-hardening.py')
          text = path.read_text()
          start = text.index("workflow_path = Path('.github/workflows/ci.yml')")
          end = text.index("env_path = Path('.env.example')")
          text = text[:start] + text[end:]
          text = text.replace("Path('.github/workflows/seed-safety-patch.yml').unlink()\n", '')
          path.write_text(text)
          PY

      - name: Apply guarded seed and credential cleanup
        run: python scripts/apply-seed-safety-hardening.py

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: require explicit safe demo seeding"
          git push origin HEAD:agent/seed-safety-hardening
